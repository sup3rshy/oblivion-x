[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oblivionx"
dynamic = ["version"]
description = "Behavior reconstruction and stage-aware analysis of macro-based Office malware"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["malware", "office", "vba", "dynamic-analysis", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "olefile>=0.46",
    "oletools>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
oblivionx = "oblivionx.cli:main"

[tool.setuptools.packages.find]
include = ["oblivionx*"]

[tool.setuptools.package-data]
oblivionx = ["resources/*"]

[tool.setuptools.dynamic]
version = {attr = "oblivionx.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end tests that build a corpus and run all experiments",
]

[tool.coverage.run]
source = ["oblivionx"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "third_party", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are kept readable in report templates
]

[tool.ruff.lint.isort]
known-first-party = ["oblivionx"]
